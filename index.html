<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Информационные карточки с Java-кодом</title>
  <link rel="stylesheet"
    href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/default.min.css">
  <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
  <style>
    /* ваши стили для карточек (как раньше) */
    .card { /* … */ }
    pre { 
      background: #f5f5f5; 
      padding: 10px; 
      border-radius: 6px; 
      overflow-x: auto; 
      margin-top: 10px;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <h1>Карточки с Java-кодом</h1>
  <div class="cards" id="cards"></div>
  <script>
    const flashcards = [
      {
        term: "main-метод в Java",
        definition: "Точка входа в программу",
        code: `
public static void main(String[] args) {
    System.out.println("Hello, Java!");
}
        `,
        image: "https://img.icons8.com/fluency/96/java-coffee-cup-logo.png"
      },
      {
        term: "Цикл for",
        definition: "Перебор с известным количеством итераций",
        code: `
for (int i = 0; i < 5; i++) {
    System.out.println(i);
}
        `
      }
      // …другие карточки
    ];

    const cardsContainer = document.getElementById('cards');
    flashcards.forEach(card => {
      const div = document.createElement('div');
      div.className = 'card';
      const img = document.createElement('img');
      if (card.image) { img.src = card.image; div.appendChild(img); }
      const text = document.createElement('div');
      text.textContent = card.term;
      div.appendChild(text);

      div.addEventListener('click', () => {
        if (text.textContent === card.term) {
          text.innerHTML = card.definition.replace(/\n/g,'<br>');
          if (card.code) {
            const pre = document.createElement('pre');
            pre.innerHTML = `<code class="language-java">${card.code}</code>`;
            div.appendChild(pre);
            hljs.highlightElement(pre.querySelector('code'));
          }
        } else {
          text.textContent = card.term;
          const pre = div.querySelector('pre');
          if (pre) div.removeChild(pre);
        }
      });

      cardsContainer.appendChild(div);
    });
  </script>
</body>
</html>
