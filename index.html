<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интерактивные карточки: Информатика</title>
  <style>
    body { font-family: sans-serif; background-color: #eef6ff; padding: 20px; margin: 0; }
    h1 { text-align: center; font-size: 28px; margin-bottom: 30px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; max-width: 1000px; margin: 0 auto; }
    .card { background-color: white; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 20px; text-align: center; font-size: 16px; cursor: pointer; transition: transform 0.3s, background-color 0.3s; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card:hover { transform: scale(1.03); background-color: #f0f8ff; }
    .card img { width: 50px; height: 50px; margin-bottom: 10px; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 6px; overflow-x: auto; margin-top: 10px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Интерактивные карточки: Информатика и Java</h1>
  <div class="cards" id="cards"></div>

  <script>
    const flashcards = [
      { term: "Алгоритм", definition: "Последовательность шагов для решения задачи.", image: "https://img.icons8.com/color/96/flow-chart.png" },
      { term: "Бит", definition: "Наименьшая единица информации (0 или 1).", image: "https://img.icons8.com/fluency/96/binary-code.png" },
      { term: "Байт", definition: "8 бит.", image: "https://img.icons8.com/fluency/96/data.png" },
      { term: "Процессор", definition: "Устройство, выполняющее команды программ.", image: "https://img.icons8.com/fluency/96/cpu.png" },
      { term: "Синтаксис main-метода", definition: "Точка входа в программу на Java.", code: `public static void main(String[] args) {\n    System.out.println("Hello, Java!");\n}`, image: "https://img.icons8.com/fluency/96/java-coffee-cup-logo.png" }
    ];

    const cardsContainer = document.getElementById('cards');
    flashcards.forEach((card) => {
      const div = document.createElement('div');
      div.className = 'card';

      const img = document.createElement('img'); img.src = card.image; img.alt = card.term;
      const text = document.createElement('div'); text.textContent = card.term;
      div.append(img, text);

      div.addEventListener('click', () => {
        if (text.textContent === card.term) {
          text.innerHTML = card.definition;
          if (card.code) {
            const pre = document.createElement('pre');
            pre.textContent = card.code;
            div.appendChild(pre);
          }
        } else {
          text.textContent = card.term;
          const pre = div.querySelector('pre'); if (pre) div.removeChild(pre);
        }
      });
      cardsContainer.appendChild(div);
    });
  </script>
</body>
</html>
